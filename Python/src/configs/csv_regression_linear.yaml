project: DeepLearning-PyTorch
run_name: csv-linear-reg
output_dir: ./outputs
task: regression

data:
  name: csv_regression
  csv_path: ./data/regression.csv
  target_col: y
  # feature_cols: [x1, x2]   # 不填则默认用除target外所有列
  batch_size: 64
  num_workers: 0
  val_split: 0.2

model:
  name: linear_regression
  # in_features: 2  # 可省略：会由CSV数据自动推断

optim:
  name: adam
  lr: 0.01

train:
  epochs: 50
  seed: 42
  device: auto

