project: DeepLearning-PyTorch
run_name: mnist-lenet
output_dir: ./outputs
task: classification

data:
  name: mnist
  data_dir: ./data
  batch_size: 128
  num_workers: 2
  val_split: 0.1
  image_size: 28

model:
  name: lenet
  num_classes: 10

optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0

train:
  epochs: 3
  seed: 42
  device: auto
  amp: false
  eval_every: 1
  early_stopping_patience: 5

